paths:
  /pets:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                # Not a component itself, but a part of a component
                $ref: '#/components/schemas/Pet/properties/name'
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type: string
