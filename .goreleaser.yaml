# GoReleaser config: https://goreleaser.com/customization/
# Releases are made by .github/workflows/release.yml on push of a v* tag.
# Local dry run: goreleaser release --snapshot --clean
# (needs a Docker daemon: ko loads the linux/amd64 image into it)
version: 2

project_name: openapi-preprocessor

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # No -X: the version is read from the build info (see version() in main.go)
    ldflags:
      - -s -w
    # Reproducible builds: the binary's mtime is the commit time
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Reproducible archives: fixed mtime, owner and mode, whatever the
    # checkout time, the user and the umask
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
      mode: 0755
    files:
      - src: LICENSE
        info: &file_info
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0644
      - src: README.md
        info: *file_info
      - src: man/man1/openapi-preprocessor.1
        info: *file_info

sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  # When the images are sent to another registry (reproduce.sh), nothing is
  # published on GitHub
  disable: '{{ isEnvSet "KO_DOCKER_REPO" }}'

kos:
  - repositories:
      - ghcr.io/dolmen-go/openapi-preprocessor
    # The image is named exactly as the repository, without the import path
    bare: true
    # Our own base (.goreleaser/base.sh): /work, user 65532:65532, nothing else
    base_image: ghcr.io/dolmen-go/openapi-preprocessor-base@sha256:2356379d13f313f927cc2349d072d7c27b333ab009235cc26d19ee1eb856e1ec
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    # Reproducible images: dated at the commit (ko writes this time in the
    # local time zone: build in UTC, as CI does)
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    # One SPDX document per platform and for the index, pushed as
    # sha256-<digest>.sbom (checked by release.yml)
    sbom: spdx
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Preprocessor for OpenAPI specifications ($ref to external files, $inline, $merge)
      org.opencontainers.image.source: https://github.com/dolmen-go/openapi-preprocessor
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0
    # ko sets them on each platform image and on the index
    annotations:
      org.opencontainers.image.description: Preprocessor for OpenAPI specifications ($ref to external files, $inline, $merge)
      org.opencontainers.image.source: https://github.com/dolmen-go/openapi-preprocessor
      org.opencontainers.image.licenses: Apache-2.0
