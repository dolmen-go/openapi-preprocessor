name: Release

# To release, tag with an annotated tag and push the tag:
#   git tag -a -m 'Release candidate vX.Y.Z-rc.N' vX.Y.Z-rc.N  (pre-release)
#   git tag -a vX.Y.Z  (public version: a message of 3 lines or more, with the changelog)
#   git push origin <tag>
# Enable the check of release tags once per clone with
#   git config core.hooksPath .githooks
# Tags with a pre-release suffix (ex: v1.0.0-rc.2) make a GitHub pre-release
# and are not published as the latest image.
# The release is also built (snapshot, not published) by the release-dry-run
# job of test.yml on every push.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # GitHub Release
  packages: write  # ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run tests
        run: go test ./...

      # For the SBOMs of the archives
      - uses: anchore/sbom-action/download-syft@v0

      # ko pushes the images with Docker's credentials
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pushed tag: when a final tag is on the same commit as a
          # pre-release tag, GoReleaser would otherwise pick the pre-release
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # ko writes the image creation time in the local time zone, which
          # changes the image digests: runners are in UTC, this makes it explicit
          TZ: UTC

      # To run the arm64 image
      - uses: docker/setup-qemu-action@v4

      # To read the SBOMs of the images. Same version as in
      # .goreleaser/base.sh and .goreleaser/reproduce.sh
      - name: Install crane
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the published image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/dolmen-go/openapi-preprocessor:${TAG#v}"
          epoch=$(git log -1 --format=%ct)
          for platform in linux/amd64 linux/arm64; do
            echo "# $platform"
            docker pull --platform "$platform" "$image"
            SOURCE_DATE_EPOCH="$epoch" PLATFORM="$platform" .goreleaser/smoke-test.sh "$image" "$TAG"
          done
          echo "# SBOM"
          # ko pushes the SBOM of each platform image as sha256-<digest>.sbom.
          # It lists the modules linked into the binary, not the Go version
          # (stdlib).
          repository=${image%:*}
          for platform in linux/amd64 linux/arm64; do
            digest=$(crane digest --platform "$platform" "$image")
            layer=$(crane manifest "$repository:sha256-${digest#sha256:}.sbom" | jq -r '.layers[0].digest')
            crane blob "$repository@$layer" > sbom.json
            # The modules of the packages linked into the binary (not test-only
            # dependencies of go.mod)
            modules=$(GOOS=linux GOARCH="${platform#linux/}" go list -deps -f '{{with .Module}}{{.Path}}{{end}}' .)
            for pkg in $(echo "$modules" | sort -u); do
              jq -e --arg pkg "$pkg" '.packages | map(.name) | index($pkg)' sbom.json > /dev/null \
                || { echo "FAIL: SBOM $platform: missing $pkg" >&2; exit 1; }
            done
            echo "ok - SBOM $platform"
          done
